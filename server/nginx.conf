#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # 脚本下载限流：每 IP 每分钟最多 10 次，突发 20
    limit_req_zone $binary_remote_addr zone=script_dl:10m rate=10r/m;

    # 默认 HTTP 服务（可选，可保留用于重定向或健康检查）
    server {
        listen       80;
        server_name  _;  # 匹配所有未指定的域名

        # 可以重定向到 HTTPS 或返回 404，这里保留原默认页面
        location / {
            root   html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # Headscale 反向代理 HTTPS
    upstream headscale {
        server 127.0.0.1:8080;
    }

    # reelax 采集服务（Go collector）
    upstream reelax_collector {
        server 127.0.0.1:8000;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name headscale.hsiyue.com;  # 请改成你实际使用的域名

        # SSL 证书路径（请确保证书文件存在）
        ssl_certificate     /opt/openresty/conf/certs/hsiyue.com.crt;
        ssl_certificate_key /opt/openresty/conf/certs/hsiyue.com.key;

        # SSL 优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 日志
        access_log logs/headscale_access.log;
        error_log logs/headscale_error.log;

        location / {
            proxy_pass http://headscale;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（Tailscale 需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    # ----- idle_moyu 站点 HTTP（重定向到 HTTPS） -----
    server {
        listen 80;
        server_name idle_moyu.hsiyue.com;
        return 301 https://$host$request_uri;   # 强制跳转 HTTPS
    }

    # ----- idle_moyu 站点 HTTPS -----
    server {
        listen 443 ssl;
        http2 on;
        server_name idle_moyu.hsiyue.com;

        # 复用现有证书（如果通配符证书，直接生效）
        ssl_certificate     /opt/openresty/conf/certs/hsiyue.com.crt;
        ssl_certificate_key /opt/openresty/conf/certs/hsiyue.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /opt/openresty/html/idle_moyu;
        index index.html index.htm fishing_sim_web.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 处理 webhook.php（同样走 HTTPS）
        location /webhook.php {
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # 可选：日志
        access_log logs/idle_moyu_access.log;
        error_log  logs/idle_moyu_error.log;
    }

    # ----- reelax 采集服务 HTTP（重定向到 HTTPS） -----
    server {
        listen 80;
        server_name reelax.hsiyue.com;
        return 301 https://$host$request_uri;
    }

    # ----- reelax 采集服务 HTTPS（反向代理到 Go collector） -----
    server {
        listen 443 ssl;
        http2 on;
        server_name reelax.hsiyue.com;

        # 复用通配符证书
        ssl_certificate     /opt/openresty/conf/certs/hsiyue.com.crt;
        ssl_certificate_key /opt/openresty/conf/certs/hsiyue.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 允许上传日志（report 接口最多 20MB，这里放宽到 25m）
        client_max_body_size 25m;

        access_log logs/reelax_access.log;
        error_log  logs/reelax_error.log;

        # 脚本下载：反代到 Go /download（记录下载日志），限速 50KB/s + 限流
        location = /arcane-assistant.user.js {
            # 无 version 参数返回最新版；?version=x.y.z 返回服务端历史归档。
            # 保留公开路径不变，以兼容旧脚本的 @updateURL/@downloadURL。
            proxy_pass http://reelax_collector/download;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            limit_rate 50k;
            limit_req zone=script_dl burst=20 nodelay;
            add_header Cache-Control "no-cache";
        }

        # FAQ 静态文档站（Astro/Starlight，构建时 base=/faq）
        location = /faq {
            return 301 /faq/;
        }

        location ^~ /faq/ {
            # 去掉 URL 中的 /faq/ 前缀，再映射到 Astro 的构建目录。
            rewrite ^/faq/(.*)$ /$1 break;
            root /opt/asmy/faq-site/dist;
            index index.html;
            try_files $uri $uri/index.html =404;
        }

        location / {
            proxy_pass http://reelax_collector;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 大日志上传放宽超时
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
